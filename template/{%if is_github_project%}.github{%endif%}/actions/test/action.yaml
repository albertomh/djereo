# Re-usable GitHub Action that runs the Django unit test suite.
#
# Usage:
#   ```
#   steps:
#     - uses: ./.github/actions/test
#   ```

name: 'test'
description: 'Run unit tests'

runs:
  using: 'composite'
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        version: "0.12.9"
        enable-cache: true
    - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      with:
        just-version: 1.59.0
    - run: just test
      shell: bash
