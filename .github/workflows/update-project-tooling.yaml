name: update-project-tooling

on:
  workflow_dispatch:
  schedule:
    # Avoid minute 0 because GitHub Actions scheduled workflows can be delayed
    # or dropped during top-of-hour load spikes.
    - cron: "17 7 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-project-tooling:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Update dependency and prek pins
        run: python3 .github/scripts/update-project-tooling.py

      - name: Refresh lockfile
        run: uv lock

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/update-project-tooling
          PR_BODY: Updates pyproject dependency constraints and prek hook revisions.
        run: |
          if git diff --quiet; then
            echo "Project tooling is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE_SHA="$(git ls-remote --heads origin "${BRANCH_NAME}" | cut -f1)"
          git checkout -B "${BRANCH_NAME}"
          git add pyproject.toml uv.lock prek.toml template
          git commit -m "chore: update project tooling"
          if [ -n "${REMOTE_SHA}" ]; then
            git push --force-with-lease="refs/heads/${BRANCH_NAME}:${REMOTE_SHA}" origin "${BRANCH_NAME}"
          else
            git push --force-with-lease="refs/heads/${BRANCH_NAME}:" origin "${BRANCH_NAME}"
          fi

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH_NAME}" \
            --title "chore: update project tooling" \
            --body "${PR_BODY}" \
          || gh pr edit "${BRANCH_NAME}" \
            --title "chore: update project tooling" \
            --body "${PR_BODY}" \
          || {
            echo "::warning::Could not create or update a pull request for ${BRANCH_NAME}."
            echo "::warning::Open it manually: https://github.com/${GITHUB_REPOSITORY}/pull/new/${BRANCH_NAME}"
          }
