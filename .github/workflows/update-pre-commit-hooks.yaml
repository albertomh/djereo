name: update-pre-commit-hooks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pre-commit-hooks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Update pre-commit hook revisions
        run: python3 .github/scripts/update-project-pre-commit-hooks.py

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/update-pre-commit-hooks
          PR_BODY: Updates pre-commit hook revisions.
        run: |
          if git diff --quiet; then
            echo "Pre-commit hooks are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE_SHA="$(git ls-remote --heads origin "${BRANCH_NAME}" | cut -f1)"
          git checkout -B "${BRANCH_NAME}"
          git add prek.toml template/prek.toml.jinja
          git commit -m "chore(deps): update pre-commit hooks"
          if [ -n "${REMOTE_SHA}" ]; then
            git push --force-with-lease="refs/heads/${BRANCH_NAME}:${REMOTE_SHA}" origin "${BRANCH_NAME}"
          else
            git push --force-with-lease="refs/heads/${BRANCH_NAME}:" origin "${BRANCH_NAME}"
          fi

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH_NAME}" \
            --title "chore(deps): update pre-commit hooks" \
            --body "${PR_BODY}" \
          || gh pr edit "${BRANCH_NAME}" \
            --title "chore(deps): update pre-commit hooks" \
            --body "${PR_BODY}"
