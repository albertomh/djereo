# Run checks and test suite.
#
# Usage:
# ```
# jobs:
#   checks:
#     uses: ./.github/workflows/_checks.yaml
# ```
name: Checks

on:
  workflow_call:

jobs:
  gha_lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  pre_commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prek

  generate-nox-py-versions:
    runs-on: ubuntu-26.04
    outputs:
      nox_sessions: ${{ steps.set-matrix.outputs.nox_sessions }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Cache nox Python versions list
      id: cache-nox-py-versions
      uses: actions/cache@v6.1.0
      with:
        path: .nox-py-versions.json
        key: nox-py-versions-${{ runner.os }}-${{ hashFiles('noxfile.py', 'pyproject.toml') }}
    - uses: wntrblm/nox@2026.10.20
      if: steps.cache-nox-py-versions.outputs.cache-hit != 'true'
    - id: set-matrix
      shell: bash
      env:
        CACHE_PY_VERSIONS_HIT: ${{ steps.cache-nox-py-versions.outputs.cache-hit }}
      run: |
        # Extract sessions from nox list into a JSON array.
        # Session lines start with '*' or '-'.
        if [[ $CACHE_PY_VERSIONS_HIT == "true" ]]; then
          nox_sessions_json="$(cat .nox-py-versions.json)"
        else
          nox_sessions_json="$(
            nox --list \
              | grep -E '^[*-] ' \
              | cut -d' ' -f2 \
              | sed 's/^tests-//' \
              | jq -R -s -c 'split("\n")[:-1]'
          )"
          echo "$nox_sessions_json" > .nox-py-versions.json
        fi
        echo "nox_sessions=$nox_sessions_json" >> "$GITHUB_OUTPUT"

  test:
    needs:
      - pre_commit
      - generate-nox-py-versions
    strategy:
      fail-fast: false
      matrix:
        nox_session: ${{ fromJson(needs.generate-nox-py-versions.outputs.nox_sessions) }}
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.9"
          enable-cache: true
      # Not redundant! Must be installed since used by integration tests in the next step.
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: 1.59.0
      - name: Extract Python version
        id: py-version
        shell: bash
        env:
          NOX_SESSION: ${{ matrix.nox_session }}
        run: |
          # Extract 3.13 from 3.13(django='5.2')
          PY_VER="${NOX_SESSION%%(*}"
          echo "version=$PY_VER" >> "$GITHUB_OUTPUT"
      - uses: wntrblm/nox@2026.10.20
        with:
          python-versions: "${{ steps.py-version.outputs.version }}"
      - run: nox --session "$NOX_SESSION"
        env:
          NOX_SESSION: tests-${{ matrix.nox_session }}

  # Configure this check as the single required status check in the `automerge-checks` ruleset.
  required:
    if: ${{ always() }}
    needs:
      - pre_commit
      - gha_lockfile
      - generate-nox-py-versions
      - test
    runs-on: ubuntu-26.04
    steps:
      - name: Fail when a check did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
